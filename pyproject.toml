[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lamindbagent"
version = "0.3.0"
description = "Read a LaminDB instance's registry with the lamindb library: search and filter artifacts, collections, runs, features and labels, and describe a record with its lineage. Read only; your key goes only to Lamin."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Baranzini Lab", email = "wanjun.gu@ucsf.edu"}]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0,<5",
    "httpx>=0.28.1,<1",
    "pydantic>=2.11.7,<3",
    "lamindb==2.12.2",
]

[project.scripts]
lamindbagent = "lamindbagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lamindbagent"]

[tool.uv]
# cryptography (pulled in by fastmcp) has no Intel Mac wheels from 49 on.
constraint-dependencies = [
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
