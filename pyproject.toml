[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lamindbagent"
version = "0.1.0"
description = "MCP adapter for LaminDB instance metadata, datasets, artifacts, collections, and guarded API/CLI planning for scientific data registries."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Baranzini Lab", email = "wanjun.gu@ucsf.edu"}]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.11.2",
    "httpx>=0.28.1",
    "pydantic>=2.11.7",
]

[project.scripts]
lamindbagent = "lamindbagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lamindbagent"]

[tool.uv]
constraint-dependencies = [
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
